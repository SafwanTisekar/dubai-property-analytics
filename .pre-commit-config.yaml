repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Power BI Desktop writes the PBIP files (TMDL, report JSON) without a final newline
      # and rewrites them on every save; "fixing" them would show every save as a change.
      # Keep them byte-for-byte as Power BI writes them.
      - id: trailing-whitespace
        exclude: ^powerbi/
      - id: end-of-file-fixer
        exclude: ^powerbi/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # The CI fixtures are deliberate (~2 MB total, CC BY 4.0); tests/test_fixtures.py
        # caps them at 3,000 lines per table instead.
        exclude: ^tests/fixtures/
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep in step with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

version: 2

# rpt: the only schema Power BI reads, as pbi_reader (docs/06 §1). Views over gold with
# Title Case column names, AED rounded to whole dirhams (bigint), no _ar columns, no raw
# C-rule flags, and medians published only where n >= var min_n. The access rules and the
# naming are checked by tests/test_rpt_access.py; the KPIs by tests/test_kpi_reconciliation.py.

models:
  - name: rpt_dim_date
    description: rpt.dim_date. Calendar; mark as the date table on "Date".
  - name: rpt_dim_area
    description: >
      rpt.dim_area. Areas with zone, a short zone label for narrow columns, and the
      OpenStreetMap centroid (NULL where not located; reports/area_centroids.md).
    columns:
      - name: '"Zone Short"'
        tests: [not_null]
  - name: rpt_dim_bedrooms
    description: >
      rpt.dim_bedrooms. Shared Bedrooms slicer: key -1 (unknown) to 20, labels Unknown /
      Studio / 1-6 BR / 7+ BR, with a sort order.
    columns:
      - name: '"Bedrooms Key"'
        tests: [unique, not_null]
  - name: rpt_dim_ready_offplan
    description: rpt.dim_ready_offplan. Shared Ready / Off-Plan slicer (2 rows).
    columns:
      - name: '"Ready / Off-Plan"'
        tests: [unique, not_null]
  - name: rpt_dld_price_index
    description: >
      rpt.dld_price_index. DLD's official monthly Residential Sale Index, rebased to Jan 2019
      = 100 with rpt.price_index's segment labels, for the ours-vs-DLD chart. Ends May 2024.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"Segment"', '"Period Start"']
    columns:
      - name: '"Segment"'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Dubai (all residential)', 'Apartments', 'Villas / Townhouses']
      - name: '"DLD Index Value"'
        tests: [not_null]
  - name: rpt_dim_property_type
    description: rpt.dim_property_type. Conformed usage group x property class.
  - name: rpt_dim_procedure
    description: rpt.dim_procedure. DLD procedures and categories.
  - name: rpt_dim_project
    description: rpt.dim_project. DLD projects (no developer yet).
  - name: rpt_transactions
    description: >
      rpt.transactions. Transaction lines in the reporting scope, without text ids or the
      individual quality flags or the per-line price. Sum "AED Counted Once" for values.
    columns:
      - name: '"Bedrooms Key"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_bedrooms')
                field: '"Bedrooms Key"'
      - name: '"Ready / Off-Plan"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_ready_offplan')
                field: '"Ready / Off-Plan"'
  - name: rpt_area_month
    description: rpt.area_month. Monthly sales and financing aggregate.
    columns:
      - name: '"Bedrooms Key"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_bedrooms')
                field: '"Bedrooms Key"'
      - name: '"Ready / Off-Plan"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_ready_offplan')
                field: '"Ready / Off-Plan"'
  - name: rpt_rent_month
    description: rpt.rent_month. Monthly rent aggregate; the only rent table in Power BI.
    columns:
      - name: '"Bedrooms Key"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_bedrooms')
                field: '"Bedrooms Key"'
  - name: rpt_rates_monthly
    description: rpt.rates_monthly. Fed Funds, Brent and (later) EIBOR by month.
  - name: rpt_report_info
    description: >
      rpt.report_info. One row with the data-as-of date, min-n and the attributions (DLD
      CC BY 4.0; OpenStreetMap ODbL for the map).

  # Phase 4 (tag post_ml): views over the ml.* tables, built by make score after make train.
  - name: rpt_price_index
    description: >
      rpt.price_index. Hedonic price index per segment (Dubai, apartments, villas, zones
      passing min-n) and period, Jan 2019 = 100, with YoY, volatility and drawdown.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"Segment Key"', '"Period Start"']
    columns:
      - name: '"Segment Key"'
        tests: [not_null]
      - name: '"Period Start"'
        tests: [not_null]
      - name: '"Sales"'
        description: Sales in the period; never below min_n (unpublished periods are absent).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Index Value"'
        tests: [not_null]
      - name: '"Drawdown"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 0
  - name: rpt_yield_quarter
    description: >
      rpt.yield_quarter. Gross yields by area / zone x property type x bedrooms x quarter,
      with both sample sizes; published cells only.
    config:
      tags: [post_ml]
    columns:
      - name: '"Rent Contracts"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Sales"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Gross Yield"'
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: '"Zone"'
        tests: [not_null]
  - name: rpt_avm_score
    description: >
      rpt.avm_score. AVM value, error and gap per clean residential market sale valued out
      of sample (validation 2024, test 2025+); the in-sample training rows stay in ml. The
      review flag marks |gap| > 25% as a statistical anomaly for collateral review, not an
      accusation. Transaction ID only on flagged rows.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(\"Transaction ID\" is not null) = (\"Review Flag\" = 'Review: statistical anomaly')"
    columns:
      - name: '"Bedrooms Key"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_bedrooms')
                field: '"Bedrooms Key"'
      - name: '"Ready / Off-Plan"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_ready_offplan')
                field: '"Ready / Off-Plan"'
      - name: '"Project Key"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_project')
                field: '"Project Key"'
      - name: '"Review Flag"'
        tests:
          - accepted_values:
              arguments:
                values: ['Review: statistical anomaly', 'Within range']
      - name: '"Date"'
        tests: [not_null]
      - name: '"Area Key"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_area')
                field: '"Area Key"'
      - name: '"Gap Pct"'
        tests: [not_null]
      - name: '"AVM Value AED"'
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: '"Model Set"'
        tests:
          - accepted_values:
              arguments:
                values: ['Validation', 'Test']
  - name: rpt_avm_performance
    description: >
      rpt.avm_performance. AVM accuracy (MdAPE, hit rates, MAPE, R², coverage) per model,
      split, breakdown and segment; segments with fewer than min_n valued sales left out.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"Model"', '"Split"', '"Breakdown"', '"Segment"']
    columns:
      - name: '"Sales Valued"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Coverage"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: '"MdAPE"'
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: '"Hit Rate 10 Pct"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
  - name: rpt_feature_importance
    description: rpt.feature_importance. AVM feature importance (mean |SHAP|, split gain), ranked.
    config:
      tags: [post_ml]
    columns:
      - name: '"Feature"'
        tests:
          - not_null
          - unique
          # every feature has a readable label (a new feature fails until it gets one)
          - relationships:
              arguments:
                to: ref('seed_avm_feature_label')
                field: feature
      - name: '"Feature Label"'
        tests: [not_null, unique]
      - name: '"Rank"'
        tests: [not_null, unique]
  - name: rpt_stress_grid
    description: >
      rpt.stress_grid. Collateral stress test (illustrative, not a regulatory stress test):
      negative equity of the last 36 months' clean residential buyers, marked to market with
      the hedonic index, per segment (Dubai / type / zone / area) x ready or off-plan x
      scenario (price shock 0 to -50%, or the 2014-2020 replay at two depths: Dubai-wide -24%, and each
      buyer's own series as the upper range) x loan basis (assumed LTV
      50-85%, CBUAE cap, registered loan of matched purchases). Loans held at origination.
      Share, count and AED blank under min_n purchases.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - '"Segment Level"'
              - '"Property Type Key"'
              - '"Zone"'
              - '"Area Key"'
              - '"Ready / Off-Plan"'
              - '"Scenario"'
              - '"Shock Pct"'
              - '"Loan Basis"'
              - '"LTV Pct"'
      - dbt_utils.expression_is_true:
          arguments:
            expression: "\"Purchases\" >= {{ var('min_n') }} and \"Negative Equity Share\" is not null"
          config:
            where: "\"Is Published\""
      - dbt_utils.expression_is_true:
          arguments:
            expression: "\"Negative Equity Share\" is null and \"Negative Equity AED\" is null"
          config:
            where: "not \"Is Published\""
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(\"Shock Pct\" is null) = (\"Scenario\" <> 'Price shock')"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(\"LTV Pct\" is null) = (\"Loan Basis\" <> 'Assumed LTV')"
    columns:
      - name: '"Segment"'
        tests: [not_null]
      - name: '"Scenario"'
        tests: [not_null]
      - name: '"Loan Basis"'
        tests: [not_null]
      - name: '"Shock Pct"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -50
                max_value: 0
      - name: '"LTV Pct"'
        tests:
          - accepted_values:
              arguments:
                values: [50, 60, 70, 80, 85]
                quote: false
      - name: '"Negative Equity Share"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: '"Negative Equity AED"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: '"Area Key"'
        tests:
          - relationships:
              arguments:
                to: ref('rpt_dim_area')
                field: '"Area Key"'
  - name: rpt_stress_replay
    description: >
      rpt.stress_replay. The 2014 -> 2020 peak-to-trough drawdown of every published index
      series, and whether the stress test's replay uses it (zone series only if published
      from the June 2014 peak).
    config:
      tags: [post_ml]
    columns:
      - name: '"Segment Key"'
        tests: [not_null, unique]
      - name: '"Drawdown"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 0
  - name: rpt_forecast
    description: >
      rpt.forecast. Monthly hedonic index and clean residential sales volume (Dubai,
      apartments, villas): actuals, then a 12-month SARIMAX forecast per Fed Funds scenario
      (flat, +100bp, -100bp) with 80% and 95% intervals.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"Target"', '"Segment"', '"Month"', '"Scenario"']
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              "Lower 95" <= "Lower 80" and "Lower 80" <= "Forecast"
              and "Forecast" <= "Upper 80" and "Upper 80" <= "Upper 95"
          config:
            where: "\"Is Forecast\""
      - dbt_utils.expression_is_true:
          arguments:
            expression: "\"Actual\" is not null and \"Forecast\" is null"
          config:
            where: "not \"Is Forecast\""
    columns:
      - name: '"Month"'
        tests: [not_null]
      - name: '"Scenario"'
        tests:
          - accepted_values:
              arguments:
                values: ['Actual', 'Rates flat', 'Rates +100bp', 'Rates -100bp']
  - name: rpt_forecast_backtest
    description: >
      rpt.forecast_backtest. Rolling-origin backtest over the last 24 complete months (index
      on real-time vintages): MAPE, MdAPE and interval coverage per target x segment x model
      x horizon.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"Target"', '"Segment"', '"Model"', '"Horizon Months"']
    columns:
      - name: '"MAPE"'
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: '"Coverage 80"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: '"Coverage 95"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

version: 2

# rpt: the only schema Power BI reads, as pbi_reader (docs/06 §1). Views over gold with
# Title Case column names, AED rounded to whole dirhams (bigint), no _ar columns, no raw
# C-rule flags, and medians published only where n >= var min_n. The access rules and the
# naming are checked by tests/test_rpt_access.py; the KPIs by tests/test_kpi_reconciliation.py.

models:
  - name: rpt_dim_date
    description: rpt.dim_date. Calendar; mark as the date table on "Date".
  - name: rpt_dim_area
    description: rpt.dim_area. Areas with zone and centroid.
  - name: rpt_dim_property_type
    description: rpt.dim_property_type. Conformed usage group x property class.
  - name: rpt_dim_procedure
    description: rpt.dim_procedure. DLD procedures and categories.
  - name: rpt_dim_project
    description: rpt.dim_project. DLD projects (no developer yet).
  - name: rpt_transactions
    description: >
      rpt.transactions. Transaction lines in the reporting scope, without text ids or the
      individual quality flags. Sum "AED Counted Once" for values.
  - name: rpt_area_month
    description: rpt.area_month. Monthly sales and financing aggregate.
  - name: rpt_rent_month
    description: rpt.rent_month. Monthly rent aggregate; the only rent table in Power BI.
  - name: rpt_rates_monthly
    description: rpt.rates_monthly. Fed Funds, Brent and (later) EIBOR by month.
  - name: rpt_report_info
    description: rpt.report_info. One row with the data-as-of date, min-n and attribution.

  # Phase 4 (tag post_ml): views over the ml.* tables, built by make score after make train.
  - name: rpt_price_index
    description: >
      rpt.price_index. Hedonic price index per segment (Dubai, apartments, villas, zones
      passing min-n) and period, Jan 2019 = 100, with YoY, volatility and drawdown.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"Segment Key"', '"Period Start"']
    columns:
      - name: '"Segment Key"'
        tests: [not_null]
      - name: '"Period Start"'
        tests: [not_null]
      - name: '"Sales"'
        description: Sales in the period; never below min_n (unpublished periods are absent).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Index Value"'
        tests: [not_null]
      - name: '"Drawdown"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 0
  - name: rpt_yield_quarter
    description: >
      rpt.yield_quarter. Gross yields by area / zone x property type x bedrooms x quarter,
      with both sample sizes; published cells only.
    config:
      tags: [post_ml]
    columns:
      - name: '"Rent Contracts"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Sales"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Gross Yield"'
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: '"Zone"'
        tests: [not_null]
  - name: rpt_avm_score
    description: >
      rpt.avm_score. AVM value, error and gap per clean residential market sale. The review
      flag marks |gap| > 25% on out-of-sample valuations (2024+) as a statistical anomaly
      for collateral review, not an accusation; training rows (2011-2023) are not flagged
      because their gaps are in-sample. Transaction ID only on flagged rows.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "\"Review Flag\" is null"
          config:
            where: "\"Model Set\" = 'Train'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "\"Review Flag\" is not null"
          config:
            where: "\"Model Set\" <> 'Train'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(\"Transaction ID\" is not null) = (\"Review Flag\" = 'Review: statistical anomaly')"
          config:
            where: "\"Review Flag\" is not null"
    columns:
      - name: '"Date"'
        tests: [not_null]
      - name: '"Area Key"'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_dim_area')
                field: '"Area Key"'
      - name: '"Gap Pct"'
        tests: [not_null]
      - name: '"AVM Value AED"'
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: '"Model Set"'
        tests:
          - accepted_values:
              arguments:
                values: ['Train', 'Validation', 'Test']
      - name: '"Model Version"'
        tests:
          - dbt_expectations.expect_column_distinct_count_to_equal:
              arguments:
                value: 1
  - name: rpt_avm_performance
    description: >
      rpt.avm_performance. AVM accuracy (MdAPE, hit rates, MAPE, R², coverage) per model,
      split, breakdown and segment; segments with fewer than min_n valued sales left out.
    config:
      tags: [post_ml]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"Model"', '"Split"', '"Breakdown"', '"Segment"']
    columns:
      - name: '"Sales Valued"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_n') }}"
      - name: '"Coverage"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: '"MdAPE"'
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: '"Hit Rate 10 Pct"'
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
  - name: rpt_feature_importance
    description: rpt.feature_importance. AVM feature importance (mean |SHAP|, split gain), ranked.
    config:
      tags: [post_ml]
    columns:
      - name: '"Feature"'
        tests: [not_null, unique]
      - name: '"Rank"'
        tests: [not_null, unique]

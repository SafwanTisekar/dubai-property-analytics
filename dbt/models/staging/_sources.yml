version: 2

sources:
  - name: bronze
    description: >
      Raw DLD and FRED files loaded by `ingest/load_bronze.py` with COPY: every source column
      as text, untouched, plus load metadata (docs/04 §1). Missing values are '' not NULL.
    schema: bronze
    tables:
      - name: dld_transactions
        description: Dubai Pulse bulk transactions export (47 columns), one row per transaction line.
        columns:
          - name: transaction_id
            description: "`<group>-<procedure>-<year>-<seq>`. Unique within one snapshot (Phase 1)."
          - name: _snapshot_date
            description: Extract date parsed from the file name; drives C1 de-duplication.
      - name: dld_rent_contracts
        description: Ejari bulk export (41 columns), one row per contract line.
        columns:
          - name: contract_id
            description: Contract number. Multi-unit contracts have one line per unit.
      - name: rates_fedfunds
        description: FRED FEDFUNDS, monthly effective federal funds rate in percent.
      - name: rates_brent
        description: FRED DCOILBRENTEU, daily Brent crude in USD per barrel ('' on non-trading days).
      - name: dld_price_index
        description: >
          DLD Residential Sale Index (data.dubai), wide: one row per month with all / flat /
          villa x monthly / quarterly / yearly x index / price_index columns. Validation
          only. Empty cells are unquoted, so they load as NULL rather than ''.
        columns:
          - name: first_date_of_month
            description: Month the values refer to (quarterly on the quarter's last month).

  # Phase 4 model outputs. Written by Python with COPY (make train), not by dbt, so the rpt
  # views over them are tagged post_ml and built by make score once the tables exist.
  - name: ml
    description: Model outputs written by src/dubai_property/models/* (make train).
    schema: ml
    tags: [post_ml]
    tables:
      - name: fct_price_index
        description: >
          Hedonic price index (rolling-window time dummy, chained), one row per segment x
          published period (n >= min_n). models/hedonic_index.py.
      - name: agg_yield_quarter
        description: >
          Gross yields (median new rent / median ready price) by area or zone x property
          type x bedrooms x quarter, published cells only (n >= min_n on both sides).
          models/yields.py.
      - name: avm_score
        description: >
          AVM valuation of every clean residential market sale the champion values: value,
          absolute % error, gap % and the out-of-sample review flag (NULL on training rows).
          models/avm.py.
      - name: avm_performance
        description: >
          AVM accuracy per model x split x breakdown x segment (min-n scored sales).
          models/avm.py.
      - name: feature_importance
        description: AVM feature importance (mean |SHAP| on test sales, split gain). models/avm.py.
      - name: stress_grid
        description: >
          Collateral stress test (illustrative): negative equity of the last 36 months' clean
          residential buyers per segment x off-plan flag x scenario (shock grid, 2014-2020
          replay) x loan basis (assumed LTV grid, CBUAE cap, matched actual loan). Shares,
          counts and AED NULL under min_n purchases. models/stress_test.py (make score).
      - name: stress_replay
        description: >
          The 2014 -> 2020 peak-to-trough drawdown of each published index series, and whether
          the replay uses it. models/stress_test.py.
      - name: forecast
        description: >
          Monthly hedonic index and clean residential sales volume, actuals plus a 12-month
          SARIMAX forecast per rate scenario with 80% / 95% intervals. models/forecast.py.
      - name: forecast_backtest
        description: >
          Rolling-origin backtest (last 24 months, real-time index vintages): MAPE, MdAPE and
          interval coverage per target x segment x model x horizon. models/forecast.py.

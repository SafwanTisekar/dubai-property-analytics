name: dubai_property
version: "0.1.0"
config-version: 2
profile: dubai_property

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

# Business thresholds used by the cleaning rules (docs/04 §2). Kept here, not in the SQL,
# so every rule reads its threshold from one place (docs/01 §7: never hard-code).
vars:
  analysis_start_date: "2004-01-01"   # charter scope; earlier rows are flagged is_pre_2004
  min_n: 20                           # min-n rule (docs/01 §7), also used for outlier bands
  band_low: 0.005                     # C4 / C14 outlier band: P0.5 ...
  band_high: 0.995                    # ... to P99.5
  price_floor_aed: 50000              # C4: a sale below AED 50k is not a real unit price
  ppsqm_tolerance: 0.05               # C6: provided vs computed price per sq m
  unit_area_min_sqm: 15               # C5: units 15-3,000 sq m ...
  unit_area_max_sqm: 3000
  villa_area_max_sqm: 10000           # ... villas up to 10,000 sq m
  land_area_min_sqm: 1                # C5: land and buildings only need a real (>= 1 sq m) area
  repeated_value_span_factor: 2       # C16: transaction_id sequence span <= 2 x lines ...
  repeated_value_area_ratio: 1.10     # ... and unit sizes differ by more than 10%
  rent_floor_aed: 1000                # C14: allocated annual rent below AED 1,000
  rent_area_placeholder_sqm: 1        # C21: actual_area <= 1 sq m is a placeholder
  # C21 (rents) and the area-weighted price population (sales): an area above the cap for its
  # property class is a community / plot / building area, not the unit's (decision, 2026-09-30).
  area_cap_apartment_sqm: 1000
  area_cap_villa_sqm: 3000
  area_cap_office_retail_sqm: 5000
  area_cap_other_sqm: 10000
  rent_max_contract_days: 3653        # rent end_date_implausible: longer than 10 years
  rent_max_days_after_snapshot: 366   # rent date_invalid: starts > 1 year after the extract
  # Gold / rpt (Phase 2b). The reporting scope runs from dim_date_start to the data snapshot
  # date (the latest transaction date, int_data_snapshot); dim_date runs on to dim_date_end
  # for forecasts. Facts outside the scope stay in gold but not in the aggregates or rpt.
  dim_date_start: "2004-01-01"
  dim_date_end: "2027-12-31"
  # Phase 4 model outputs (ml.*, written by make train). rpt shows one model version; these
  # match the *_MODEL_VERSION constants in config.py (tests/test_config.py).
  hedonic_model_version: "hedonic-rtd-v1"
  yield_model_version: "yield-gross-v1"
  avm_model_version: "avm-lgbm-v1"
  stress_model_version: "stress-mtm-v1"
  forecast_model_version: "forecast-sarimax-v1"
  index_base_month: "2019-01-01"      # hedonic index = 100 (Q1 2019 for quarterly series)

# Layer -> schema + materialisation (docs/03 §3 and §7). Schema names are used verbatim
# thanks to macros/generate_schema_name.sql (no "<target>_" prefix).
models:
  dubai_property:
    staging:        # typing, renaming, decoding: thin views over bronze
      +schema: silver
      +materialized: view
    intermediate:   # cleaning rules C1-C22 as flags; heavy joins, so materialised
      +schema: silver
      +materialized: table
    marts:          # star schema facts, dimensions, aggregates (indexed via config)
      +schema: gold
      +materialized: table
    reporting:      # the only layer Power BI reads (pbi_reader has SELECT on rpt only)
      +schema: rpt
      +materialized: view

seeds:
  dubai_property:
    +schema: silver
    seed_area:
      +column_types:
        area_id: integer
        area_name_en: text
        zone: text
        latitude: numeric
        longitude: numeric
        centroid_source: text
    seed_procedure_category:
      +column_types: {procedure_category: text, is_market_sale: boolean, description: text}
    seed_procedure_map:
      +column_types:
        procedure_key: integer
        trans_group: text
        procedure_id: integer
        procedure_name_en: text
        procedure_category: text
        is_market_sale: boolean
        is_lease_to_own: boolean
        is_new_mortgage: boolean
        is_portfolio_mortgage: boolean
        amount_is_loan: boolean
        note: text
    seed_rooms_map:
      +column_types:
        rooms_en: text
        bedrooms: smallint
        room_class: text
        is_penthouse: boolean
        is_commercial_unit: boolean
    seed_rent_subtype_map:
      +column_types: {ejari_property_sub_type_en: text, bedrooms: smallint, room_class: text}
    seed_property_class:
      +column_types: {property_class_id: integer, property_class: text, description: text}
    seed_property_usage_map:
      +column_types: {source: text, property_usage: text, usage_group_id: integer, usage_group: text}
    seed_property_type_map:
      +column_types: {source: text, property_type: text, property_sub_type: text, property_class: text}
    seed_ltv_rules:
      +column_types:
        rule_id: integer
        borrower: text
        property_status: text
        home_number: text
        value_band: text
        max_ltv: numeric
        effective_from: date
        effective_to: date
        source_citation: text
        source_url: text
        secondary_source_url: text
        verified: boolean
        note: text
    seed_phase1_reconciliation:
      +column_types:
        dataset: text
        metric: text
        trans_group: text
        expected_value: numeric
        note: text

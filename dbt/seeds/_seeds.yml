version: 2

seeds:
  - name: seed_procedure_category
    description: >
      The procedure categories used by seed_procedure_map, with the market-sale flag each
      implies. `inheritance` is kept although no procedure maps to it in the 2026-09 extract
      (phase1_findings §1), so a future snapshot has a place to land.
    columns:
      - name: procedure_category
        tests: [unique, not_null]
      - name: is_market_sale
        tests: [not_null]

  - name: seed_procedure_map
    description: >
      C2: every (trans_group, procedure_id) pair in the DLD register (58 in the 2026-09
      extract) -> category and flags. Keyed on the pair, not the name, because six
      lease-to-own codes are registered under both Sales and Mortgages (phase1_findings §1).
      A procedure missing from this seed fails the stg_transactions not_null test on
      procedure_category, so a new DLD procedure can't slip through unmapped.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trans_group, procedure_id]
      # A procedure's market-sale flag must agree with its category.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_market_sale = (procedure_category in ('market_sale', 'offplan_sale'))"
      # C10: only completed-property mortgage registrations carry a verified loan amount.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not amount_is_loan or (trans_group = 'Mortgages' and procedure_id in (13, 190))"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_lease_to_own = (procedure_category = 'lease_to_own')"
      # A new mortgage is individual or portfolio, never both.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (is_new_mortgage and is_portfolio_mortgage)"
    columns:
      - name: procedure_key
        description: >
          Stable integer key for dim_procedure. Append new procedures with the next number;
          never renumber (Power BI relationships and saved filters use it).
        tests: [unique, not_null]
      - name: trans_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Sales, Mortgages, Gifts]
      - name: procedure_id
        tests: [not_null]
      - name: procedure_category
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_procedure_category')
                field: procedure_category
      - name: is_market_sale
        description: Arm's-length sale; feeds prices, indices, yields and the AVM.
      - name: is_lease_to_own
        description: C17. Lease-to-own / lease-development deal, either leg.
      - name: is_new_mortgage
        description: >
          A new individual (single-unit) bank mortgage: Mortgage Registration, Delayed Mortgage,
          Mortgage Pre-Registration. The mortgage-share numerator. Portfolio registrations,
          modifications, transfers, development and lease finance are excluded.
      - name: is_portfolio_mortgage
        description: >
          A new portfolio mortgage registration (one loan over several units: procedures 43,
          101, 60). Reported separately from mortgage share, counted once per deal (C16).
      - name: amount_is_loan
        description: C10. `actual_worth` is the loan amount (Mortgage Registration, Delayed Mortgage).

  - name: seed_rooms_map
    description: "C7: DLD `rooms_en` label -> bedrooms (Studio = 0) and unit-type flags."
    columns:
      - name: rooms_en
        tests: [unique, not_null]
      - name: bedrooms
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10

  - name: seed_rent_subtype_map
    description: "C22: Ejari residential sub-type label -> bedrooms (Studio = 0). Other sub-types have no bedrooms."
    columns:
      - name: ejari_property_sub_type_en
        tests: [unique, not_null]

  - name: seed_area
    description: >
      C8: every DLD area_id seen in transactions or rents (265 IDs; Phase 1's "266" counted
      the blank area_id on 3 rent lines as a value) -> canonical name and zone. Zones group
      areas into markets for the min-n roll-up. Every area has a zone; `make unzoned`
      (reports/unzoned_areas.md) lists any that don't, e.g. a new area in a later snapshot.
    columns:
      - name: area_id
        tests: [unique, not_null]
      - name: area_name_en
        tests: [not_null]
      - name: zone
        description: Market zone for roll-ups. NULL = not assigned yet.
      - name: latitude
        description: Area centroid latitude (WGS84) for the Power BI bubble map. Empty until Phase 5.
      - name: longitude
        description: Area centroid longitude (WGS84). Empty until Phase 5.

  - name: seed_phase1_reconciliation
    description: >
      The Phase 1 figures (reports/phase1_findings.md, phase1_evidence.md) that silver must
      reproduce. The reconciliation tests check them only when bronze holds exactly the
      Phase 1 snapshot (the `bronze_rows` gate), so they are skipped on the CI fixtures.
    columns:
      - name: metric
        tests: [not_null]

  - name: seed_property_class
    description: >
      Conformed property classes shared by DLD sales and Ejari rents (dim_property_type).
      property_class_id is the last two digits of property_type_key; 99 = Unknown (no
      property type in the source).
    columns:
      - name: property_class_id
        tests: [unique, not_null]
      - name: property_class
        tests: [unique, not_null]

  - name: seed_property_usage_map
    description: >
      Source usage label -> conformed usage group, per source (DLD and Ejari use different
      labels, e.g. Hospitality vs Tourist origin). usage_group_id is the hundreds digit of
      property_type_key; 9 = Unknown (blank usage in the source, 15,050 rent lines).
      Mixed-use, education, health and agricultural labels share "Mixed & other" so no group
      is too thin to publish (min-n rule).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, property_usage]
    columns:
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: [transactions, rents]
      - name: usage_group_id
        tests: [not_null]

  - name: seed_property_type_map
    description: >
      Source property type (and sub-type) -> conformed property class. DLD rows are keyed
      on type x sub-type (Unit/Flat -> Apartment); a blank sub-type is a wildcard used when
      no exact row matches (Villa, Land, Building, other Units). Ejari rows are keyed on the
      Ejari property type alone, because its sub-type is a layout (2 bed rooms+hall) that
      becomes bedrooms (C22), not a property class. A label present in the data but missing
      here fails the int_property_type_lookup tests.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, property_type, property_sub_type]
    columns:
      - name: property_class
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_property_class')
                field: property_class

  - name: seed_ltv_rules
    description: >
      CBUAE mortgage loan-to-value caps for the Phase 4 stress test (docs/05 §4). Values
      follow the CBUAE Regulations Regarding Mortgage Loans (Notice 31/2013, as amended) as
      commonly summarised; **verified = false until the owner checks each row against the
      current CBUAE rulebook** and updates source_citation. The stress test is illustrative
      and must say which LTVs it assumed.
    columns:
      - name: rule_id
        tests: [unique, not_null]
      - name: max_ltv
        description: Maximum loan / property value, as a decimal (0.80 = 80%).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: source_citation
        tests: [not_null]
      - name: verified
        description: The owner has checked this row against the current CBUAE regulation.

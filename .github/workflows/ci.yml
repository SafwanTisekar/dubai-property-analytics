name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Superuser connection for `make db` (psql reads PGHOST/PGPORT/PGPASSWORD).
      PG_ADMIN_USER: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: postgres
      # Application settings, as in .env locally. Throwaway CI-only passwords.
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: dubai_property
      PG_USER: dpa_owner
      PG_PASSWORD: ci_owner_pw
      PBI_READER_PASSWORD: ci_reader_pw
      DBT_THREADS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: make lint

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create database, roles, schemas (make db)
        run: make db

      - name: Tests (pytest, incl. db integration tests)
        run: uv run pytest

      - name: dbt deps + debug
        run: make dbt-deps dbt-debug

      # Committed ~2k-line extracts of the real DLD files (tests/fixtures/README.md), loaded
      # with the production loader, then the full dbt build and the DQ report on them.
      - name: Load CI fixtures into bronze
        run: make bronze BRONZE_ROOT=tests/fixtures

      - name: dbt build (silver, gold, rpt) + DQ report, KPI check, dictionary on the fixtures
        run: make dbt

      # The first pytest run happens before gold exists, so these skip there. Re-run them
      # now: pbi_reader reads rpt and nothing else, every KPI reconciles silver -> rpt, and
      # every Phase 3 analysis query runs on gold (the notebooks themselves are not run in
      # CI: fixture numbers mean nothing).
      - name: rpt access + KPI reconciliation + analysis queries (after the build)
        run: uv run pytest tests/test_rpt_access.py tests/test_kpi_reconciliation.py tests/test_analysis.py
